<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="bgHover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <style>
      @keyframes traitPulse {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.05); }
      }
      @keyframes traitSlide {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      .trait-line { animation: traitSlide 1.5s ease-out forwards; }
      .trait-bar { animation: traitPulse 3s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Background rounded square -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#bg)"/>

  <!-- Inner glow ring -->
  <rect x="16" y="16" width="168" height="168" rx="36" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- T letter - vertical stem -->
  <rect x="89" y="50" width="22" height="110" rx="6" fill="white"/>

  <!-- T letter - horizontal bar (the TRAIT - thick stripe like WhatsApp's design) -->
  <rect x="40" y="50" width="120" height="28" rx="8" fill="white" class="trait-bar"/>

  <!-- Accent curved stripe below the T - WhatsApp-inspired swoosh -->
  <path d="M55 148 C 75 165, 125 165, 145 148" 
        fill="none" 
        stroke="rgba(255,255,255,0.35)" 
        stroke-width="6" 
        stroke-linecap="round"
        class="trait-line"
        stroke-dasharray="200"/>

  <!-- Subtle highlight on top of horizontal bar -->
  <rect x="42" y="52" width="116" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
</svg>
