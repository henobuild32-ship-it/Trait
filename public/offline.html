<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRAIT — Hors ligne</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
    }
    .container { text-align: center; max-width: 380px; }
    .icon {
      width: 80px; height: 80px;
      background: #f1f5f9;
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
    }
    .icon svg { width: 40px; height: 40px; color: #0D5C63; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: #64748b; line-height: 1.5; margin-bottom: 24px; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: #f1f5f9; padding: 8px 16px; border-radius: 20px;
      font-size: 12px; color: #475569; font-weight: 600;
    }
    .badge svg { width: 14px; height: 14px; }
    .status { margin-top: 32px; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #f59e0b;
      display: inline-block; margin-right: 6px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .status-text { font-size: 12px; color: #94a3b8; }
    .footer { margin-top: 48px; font-size: 11px; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 00-2.91-.09z"/>
        <path d="M12 15l-3-3a22 22 0 012-3.95A12.88 12.88 0 0122 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 01-4 2z"/>
        <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
        <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
      </svg>
    </div>
    <h1>Vous êtes hors ligne</h1>
    <p>Les transactions effectuées seront automatiquement synchronisées dès que vous retrouverez une connexion.</p>
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1010 10A10 10 0 0012 2zm0 14a2 2 0 112-2 2 2 0 01-2 2zm0-10a2 2 0 012 2v4a2 2 0 01-4 0V8a2 2 0 012-2z"/></svg>
      Mode hors ligne activé
    </div>
    <div class="status">
      <span class="dot"></span>
      <span class="status-text">En attente de connexion...</span>
    </div>
    <div class="footer">TRAIT v2.0</div>
  </div>
</body>
</html>
